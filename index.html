<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio profesional de Luis Jhonata Cueva R. — Ingeniero de Sistemas y Arquitecto Frontend especializado en React SPA."
    />
    <meta name="theme-color" content="#00E1FF" />
    <title>LJCR — Portfolio</title>

    <!-- ── DNS Prefetch: resuelve el dominio antes de que se necesiten las imágenes ── -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link
      rel="preconnect"
      href="https://raw.githubusercontent.com"
      crossorigin
    />

    <!-- ── Google Fonts: preconnect (DNS + TLS handshake en paralelo) ────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── FUENTE ACTIVA ─────────────────────────────────────────────────── -->
    <!--
      Plus Jakarta Sans: solo los pesos usados en UI (400, 500, 600, 700, 800).
      Se eliminó ital,wght (itálica) ya que no se usa, ahorrando ~10 KB.
      display=swap evita FOIT (Flash of Invisible Text).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
